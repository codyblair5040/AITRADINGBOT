circuit_breakers:
  consecutive_losses: 3
  daily_loss_limit: 0.05
  max_drawdown: 0.1
  volatility_limit: 0.15
position_sizing:
  max_portfolio_risk: 0.02
  max_position_size: 0.1
  method: fixed_fractional
position_sizing_method: fixed_fractional
stop_loss:
  default_pct: 0.02
  enabled: true
  max_pct: 0.05
  method: dynamic
take_profit:
  enabled: true
  levels:
  - pct: 0.01
    size_pct: 0.33
  - pct: 0.02
    size_pct: 0.33
  - pct: 0.03
    size_pct: 0.34
